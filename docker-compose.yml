version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradetracker}
      POSTGRES_DB: ${POSTGRES_DB:-tradetracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tradetracker']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
